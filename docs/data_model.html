<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gather data model</title>
    <style>
      body {
        margin: 0;
        width: 2160px;
        height: 960px;
        background: #fff;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #1f2a24;
        position: relative;
        overflow: hidden;
      }
      .class {
        position: absolute;
        width: 330px;
        border: 1.5px solid #2f3b35;
        background: #fff;
        z-index: 2;
      }
      .class h3 {
        margin: 0;
        padding: 7px 10px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        background: #e9f0ea;
        border-bottom: 1.5px solid #2f3b35;
      }
      .class ul {
        list-style: none;
        margin: 0;
        padding: 6px 10px 7px;
      }
      .class li {
        font-size: 12.5px;
        line-height: 20px;
        white-space: nowrap;
      }
      .class li .type {
        color: #3d4f45;
      }
      .class li .tag {
        color: #2f7a57;
        font-weight: 600;
      }
      .class li.constraint {
        color: #6b776f;
        font-style: italic;
        border-top: 1px dashed #c9d2cc;
        margin-top: 4px;
        padding-top: 2px;
      }
      svg {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      svg text {
        font-size: 12px;
        fill: #1f2a24;
      }
      svg text.role {
        font-style: italic;
        fill: #4b5a51;
      }
      .legend {
        position: absolute;
        left: 40px;
        bottom: 22px;
        font-size: 13px;
        color: #3d4f45;
      }
      .legend b {
        color: #1f2a24;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <svg id="edges" width="2160" height="960"></svg>
    <div class="legend">
      <b>Gather — logical data model (UML class diagram)</b><br />
      {PK} primary key · {FK} foreign key · {unique} unique value · {nullable} may be empty ·
      a Msg belongs to exactly one of Channel or DirectChat · a reply (thread) points to its
      parent Msg · unread count = messages newer than lastReadAt
    </div>
    <script>
      // name: [x, y, [[attribute, type, tag], ...], [constraints]]
      const CLASSES = {
        Invite: [40, 90, [
          ['id', 'uuid', '{PK}'],
          ['channelId', 'uuid', '{FK}'],
          ['inviterId', 'uuid', '{FK}'],
          ['inviteeId', 'uuid', '{FK}'],
          ['status', "enum('pending','accepted','rejected')", ''],
          ['createdAt', 'timestamptz', ''],
        ]],
        Channel: [470, 90, [
          ['id', 'uuid', '{PK}'],
          ['ownerId', 'uuid', '{FK}'],
          ['name', 'varchar(255)', '{unique}'],
          ['type', "enum('public','private')", ''],
          ['topic', 'varchar(255)', ''],
          ['lastActivity', 'timestamptz', ''],
          ['createdAt', 'timestamptz', ''],
        ]],
        VoteKick: [40, 360, [
          ['id', 'uuid', '{PK}'],
          ['channelId', 'uuid', '{FK}'],
          ['targetId', 'uuid', '{FK}'],
          ['createdAt', 'timestamptz', ''],
        ], ['{unique(channelId, targetId)}']],
        VoteKickVoter: [40, 600, [
          ['id', 'uuid', '{PK}'],
          ['voteKickId', 'uuid', '{FK}'],
          ['userId', 'uuid', '{FK}'],
        ], ['{unique(voteKickId, userId)}']],
        UserChannel: [470, 400, [
          ['id', 'uuid', '{PK}'],
          ['channelId', 'uuid', '{FK}'],
          ['userId', 'uuid', '{FK}'],
          ['banned', 'boolean', ''],
          ['favorite', 'boolean', ''],
          ['lastReadAt', 'timestamptz', ''],
          ['joinedAt', 'timestamptz', ''],
        ], ['{unique(channelId, userId)}']],
        User: [900, 330, [
          ['id', 'uuid', '{PK}'],
          ['name', 'varchar(255)', ''],
          ['lastName', 'varchar(255)', ''],
          ['nick', 'varchar(255)', '{unique}'],
          ['email', 'varchar(255)', '{unique}'],
          ['password', 'varchar(255)', '(hash)'],
          ['state', "enum('Online','DND','Offline')", ''],
          ['mentionOnlyNotif', 'boolean', ''],
          ['createdAt', 'timestamptz', ''],
        ]],
        Msg: [1340, 330, [
          ['id', 'bigserial', '{PK}'],
          ['channelId', 'uuid', '{FK, nullable}'],
          ['directChatId', 'uuid', '{FK, nullable}'],
          ['senderId', 'uuid', '{FK}'],
          ['parentId', 'bigint', '{FK, nullable}'],
          ['textContent', 'text', ''],
          ['createdAt', 'timestamptz', ''],
          ['editedAt', 'timestamptz', '{nullable}'],
        ]],
        MsgMention: [1780, 90, [
          ['id', 'uuid', '{PK}'],
          ['msgId', 'bigint', '{FK}'],
          ['mentionedId', 'uuid', '{FK}'],
        ]],
        Reaction: [1780, 330, [
          ['id', 'uuid', '{PK}'],
          ['msgId', 'bigint', '{FK}'],
          ['userId', 'uuid', '{FK}'],
          ['emoji', 'varchar(16)', ''],
        ], ['{unique(msgId, userId, emoji)}']],
        SavedMsg: [1780, 600, [
          ['id', 'uuid', '{PK}'],
          ['userId', 'uuid', '{FK}'],
          ['msgId', 'bigint', '{FK}'],
          ['createdAt', 'timestamptz', ''],
        ]],
        DirectChatMember: [900, 700, [
          ['id', 'uuid', '{PK}'],
          ['directChatId', 'uuid', '{FK}'],
          ['userId', 'uuid', '{FK}'],
          ['favorite', 'boolean', ''],
          ['lastReadAt', 'timestamptz', ''],
        ]],
        DirectChat: [1340, 700, [
          ['id', 'uuid', '{PK}'],
          ['createdAt', 'timestamptz', ''],
        ]],
      };

      // Each edge: [from, side, t, to, side, t, fromMultiplicity, toMultiplicity, role, via, label]
      // `via` is a list of {x} / {y} steps for the orthogonal route between the two ends;
      // the optional `label` [x, y, anchor] places the role name by hand where it would collide.
      const EDGES = [
        ['User', 'left', 0.1, 'Channel', 'right', 0.6, '1', '0..*', 'owns', [{ x: 860 }]],
        ['User', 'left', 0.45, 'UserChannel', 'right', 0.35, '1', '0..*', 'is member', [{ x: 850 }], [850, 505, 'middle']],
        ['Channel', 'bottom', 0.5, 'UserChannel', 'top', 0.5, '1', '1..*', 'has members', []],
        ['Channel', 'left', 0.5, 'Invite', 'right', 0.5, '1', '0..*', 'invites to', []],
        ['User', 'top', 0.08, 'Invite', 'top', 0.45, '1', '0..*', 'is inviting', [{ y: 40 }]],
        ['User', 'top', 0.16, 'Invite', 'top', 0.75, '1', '0..*', 'is invited', [{ y: 62 }]],
        ['Channel', 'bottom', 0.15, 'VoteKick', 'top', 0.7, '1', '0..*', 'happens in', [{ y: 325 }]],
        ['User', 'bottom', 0.1, 'VoteKick', 'right', 0.5, '1', '0..*', 'is target', [{ y: 655 }, { x: 405 }]],
        ['VoteKick', 'bottom', 0.5, 'VoteKickVoter', 'top', 0.5, '1', '1..3', 'has voters', []],
        ['User', 'bottom', 0.2, 'VoteKickVoter', 'right', 0.5, '1', '0..*', 'votes', [{ y: 678 }, { x: 425 }]],
        ['User', 'bottom', 0.65, 'DirectChatMember', 'top', 0.65, '1', '0..*', 'takes part', []],
        ['DirectChat', 'left', 0.5, 'DirectChatMember', 'right', 0.3, '1', '2', 'has', []],
        ['Channel', 'right', 0.25, 'Msg', 'top', 0.3, '0..1', '0..*', 'contains', [{ x: 1439 }]],
        ['DirectChat', 'top', 0.5, 'Msg', 'bottom', 0.5, '0..1', '0..*', 'contains', []],
        ['User', 'right', 0.3, 'Msg', 'left', 0.3, '1', '0..*', 'sends', []],
        ['Msg', 'top', 0.88, 'Msg', 'right', 0.1, '0..1', '0..*', 'replies', [{ y: 300 }, { x: 1705 }], [1712, 322, 'start']],
        ['Msg', 'top', 0.6, 'MsgMention', 'left', 0.55, '1', '0..*', 'has', [{ y: 152 }]],
        ['User', 'top', 0.8, 'MsgMention', 'left', 0.2, '1', '0..*', 'is mentioned', [{ y: 112 }]],
        ['Msg', 'right', 0.38, 'Reaction', 'left', 0.5, '1', '0..*', 'has', []],
        ['User', 'bottom', 0.88, 'Reaction', 'bottom', 0.3, '1', '0..*', 'reacts', [{ y: 588 }]],
        ['Msg', 'bottom', 0.82, 'SavedMsg', 'left', 0.6, '1', '0..*', 'is saved', [{ y: 0 }]],
        ['User', 'bottom', 0.97, 'SavedMsg', 'left', 0.35, '1', '0..*', 'saves', [{ y: 0 }], [1290, 662, 'middle']],
      ];

      const boxes = {};
      for (const [name, [x, y, attrs, constraints = []]] of Object.entries(CLASSES)) {
        const el = document.createElement('div');
        el.className = 'class';
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        const rows = attrs
          .map(
            ([a, t, tag]) =>
              `<li>+ ${a}: <span class="type">${t}</span> <span class="tag">${tag}</span></li>`,
          )
          .concat(constraints.map((c) => `<li class="constraint">${c}</li>`))
          .join('');
        el.innerHTML = `<h3>${name}</h3><ul>${rows}</ul>`;
        document.body.appendChild(el);
        boxes[name] = el;
      }

      const svg = document.getElementById('edges');
      const NS = 'http://www.w3.org/2000/svg';
      function rect(name) {
        const r = boxes[name].getBoundingClientRect();
        return { x: r.left, y: r.top, w: r.width, h: r.height };
      }
      function anchor(name, side, t) {
        const r = rect(name);
        if (side === 'left') return { x: r.x, y: r.y + r.h * t };
        if (side === 'right') return { x: r.x + r.w, y: r.y + r.h * t };
        if (side === 'top') return { x: r.x + r.w * t, y: r.y };
        return { x: r.x + r.w * t, y: r.y + r.h };
      }
      const horizontal = (side) => side === 'left' || side === 'right';
      function route(a, aSide, b, bSide, via) {
        const points = [a];
        let last = a;
        const steps = via.length
          ? via
          : horizontal(aSide) && horizontal(bSide)
            ? [{ x: (a.x + b.x) / 2 }]
            : !horizontal(aSide) && !horizontal(bSide)
              ? [{ y: (a.y + b.y) / 2 }]
              : [];
        for (const step of steps) {
          // { y: 0 } means "the end's y" (used for an L-shaped route into a side).
          const next =
            'x' in step ? { x: step.x, y: last.y } : { x: last.x, y: step.y || b.y };
          points.push(next);
          last = next;
        }
        if (horizontal(bSide)) points.push({ x: last.x, y: b.y });
        else points.push({ x: b.x, y: last.y });
        points.push(b);
        return points.filter(
          (p, i) => i === 0 || p.x !== points[i - 1].x || p.y !== points[i - 1].y,
        );
      }
      function text(x, y, value, cls, anchorPos = 'middle') {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', x);
        t.setAttribute('y', y);
        t.setAttribute('text-anchor', anchorPos);
        if (cls) t.setAttribute('class', cls);
        t.textContent = value;
        svg.appendChild(t);
        return t;
      }
      function multiplicity(p, side, value) {
        const dx = side === 'left' ? -8 : side === 'right' ? 8 : 8;
        const dy = side === 'top' ? -7 : side === 'bottom' ? 16 : -6;
        text(p.x + dx, p.y + dy, value, '', side === 'left' ? 'end' : 'start');
      }
      for (const [from, fs, ft, to, ts, tt, fm, tm, role, via, label] of EDGES) {
        const a = anchor(from, fs, ft);
        const b = anchor(to, ts, tt);
        const points = route(a, fs, b, ts, via);
        const line = document.createElementNS(NS, 'polyline');
        line.setAttribute('points', points.map((p) => `${p.x},${p.y}`).join(' '));
        line.setAttribute('fill', 'none');
        line.setAttribute('stroke', '#2f3b35');
        line.setAttribute('stroke-width', '1.4');
        svg.appendChild(line);
        multiplicity(a, fs, fm);
        multiplicity(b, ts, tm);
        // Role name in the middle of the longest segment, on a white background.
        let best = [points[0], points[1]];
        for (let i = 1; i < points.length; i++) {
          const [p, q] = [points[i - 1], points[i]];
          const len = Math.abs(p.x - q.x) + Math.abs(p.y - q.y);
          const bestLen = Math.abs(best[0].x - best[1].x) + Math.abs(best[0].y - best[1].y);
          if (len > bestLen) best = [p, q];
        }
        // Below a horizontal segment, left of a vertical one: multiplicities sit above / right.
        const mx = (best[0].x + best[1].x) / 2;
        const my = (best[0].y + best[1].y) / 2;
        if (label) text(label[0], label[1], role, 'role', label[2]);
        else if (best[0].y === best[1].y) text(mx, my + 15, role, 'role');
        else text(mx - 6, my + 4, role, 'role', 'end');
      }
    </script>
  </body>
</html>
